[project]
name = "meta-ads-competitor-tracker"
version = "0.0.0"
requires-python = ">=3.12"
# Vercel installs from this manifest. Match the pins in requirements.txt.
dependencies = [
    "alembic==1.20.0",
    "SQLAlchemy==2.1.3",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "boto3==1.43.108",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "Babel==2.18.0",
    "meta-ads-collector==1.6.0",
    "Pillow==12.3.0",
]

[tool.vercel]
entrypoint = "tracker.web.app:app"
